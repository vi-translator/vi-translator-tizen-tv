<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VI Translator</title>
    <link rel="stylesheet" href="css/app.css" />
    <!-- Samsung's TV APIs (product info, network): only there on the TV -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
  </head>
  <body>
    <!-- connected: the PC's TV page, transparent, over the HDMI picture (shown behind this page) -->
    <iframe id="overlay" src="about:blank" tabindex="-1" allowtransparency="true"></iframe>

    <!-- not connected: the code -->
    <section id="waiting" class="screen hidden">
      <div class="column">
        <div class="brand"><img src="logo.png" alt="" /><span class="sunset">VI TRANSLATOR</span></div>
        <div class="line"></div>
        <div id="enter-code" class="text"></div>
        <div id="code" class="code" dir="ltr"></div>
        <div id="where" class="muted"></div>
        <div id="this-tv" class="muted small"></div>
      </div>
      <!-- the app's language: the TV's own, or one of the desktop app's, in the top corner -->
      <button id="language" class="button lang-button corner"></button>
    </section>

    <!-- connected, on OK: the connection, the input, Disconnect -->
    <section id="menu" class="panel hidden">
      <div class="brand small-brand"><img src="logo.png" alt="" /><span class="sunset">VI TRANSLATOR</span></div>
      <div class="line"></div>
      <div class="status"><span id="dot" class="dot"></span><span id="status"></span></div>
      <div class="buttons">
        <button id="input" class="button"></button>
        <button id="menu-language" class="button lang-button"></button>
        <button id="disconnect" class="button"></button>
      </div>
    </section>

    <!-- the language list: the TV's own first, then each language by its own name -->
    <section id="languages" class="panel picker hidden">
      <div id="languages-title" class="picker-title"></div>
      <div id="language-list" class="list"></div>
    </section>

    <div id="hint" class="hint hidden"></div>

    <!-- the PC or phone not answering (the phone app paused by iOS during Remote Play): a note at the top -->
    <div id="source-note" class="source-note hidden"><div class="note"><span class="note-dot"></span><span id="source-note-text"></span></div></div>

    <script src="js/strings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
